# Carry the product pages across to ernster.dev/snarkapi/, so the portfolio
# host keeps its own copy of them.
#
# docs/ is published at snarkapi.com/about/, the canonical home. Once this
# repository took snarkapi.com as its Pages domain, GitHub began redirecting
# its own project path on ernster.dev there, so the portfolio copy lives in the
# oernster.github.io repository under snarkapi/ instead. Never rename this
# repository to exactly snarkapi: its project path would then shadow the mirror. That repository has no
# way of noticing when this one changes; this workflow tells it.
#
# The pages keep their canonical links pointing at snarkapi.com, which is what
# stops the two hosts competing for the same content.
#
# Needs one secret. ERNSTER_DEV_TOKEN is a fine-grained personal access token
# scoped to oernster/oernster.github.io alone, with Contents set to read and
# write; without it nothing can be pushed at all.
name: Mirror the product pages to ernster.dev

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/mirror-ernster-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-ernster-dev
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse early when the token is missing
        env:
          ERNSTER_DEV_TOKEN: ${{ secrets.ERNSTER_DEV_TOKEN }}
        run: |
          if [ -z "$ERNSTER_DEV_TOKEN" ]; then
            echo "::error::ERNSTER_DEV_TOKEN is either unset or expired. Create a fine-grained personal access token scoped to oernster/oernster.github.io alone, with Contents set to read and write, then add it to this repository under Settings, Secrets and variables, Actions, named ERNSTER_DEV_TOKEN."
            exit 1
          fi

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: snark

      - name: Check out ernster.dev
        uses: actions/checkout@v4
        with:
          repository: oernster/oernster.github.io
          token: ${{ secrets.ERNSTER_DEV_TOKEN }}
          path: ernster-dev

      # snarkapi/ belongs to this mirror alone, so it is replaced wholesale:
      # a page deleted here is deleted there. CNAME and .nojekyll belong to the
      # host repository's root, never to a sub-folder.
      - name: Carry the pages across
        run: |
          rsync -a --delete --exclude CNAME --exclude .nojekyll snark/docs/ ernster-dev/snarkapi/

      - name: Push the mirror, only when something moved
        working-directory: ernster-dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snarkapi
          if git diff --cached --quiet; then
            echo "Nothing moved; the mirror already matched."
            exit 0
          fi
          git commit -m "Mirror the SnarkAPI pages from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
          git push
