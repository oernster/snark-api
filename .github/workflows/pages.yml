name: Test and deploy

# snarkapi.com is static files on GitHub Pages. Every push and pull request
# runs the coverage gate. A push to main that passes it is built by
# build_site.py and published; the deploy needs the test job, so a red gate can
# never reach the live site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the local venv; requirements.txt pins every package to it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pyproject.toml carries the 100% branch-coverage gate in addopts.
      - name: pytest
        run: python -m pytest

  site:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fails on any internal link that lands on no written file.
      - name: Build the static site
        run: python build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Asks the live site rather than trusting the build: each URL must answer
      # 200 directly. --insecure because this probes paths, not TLS; until Pages
      # issues the custom domain's certificate it presents a generic one.
      - name: Smoke-check the live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          failed=0
          for path in "" quotes.json about/ about/why.html sarcasm robots.txt sitemap.xml favicon.ico; do
            code=$(curl -s --insecure -o /dev/null -w "%{http_code}" "${PAGE_URL}${path}")
            echo "${code} /${path}"
            [ "$code" = "200" ] || failed=1
          done
          exit $failed
